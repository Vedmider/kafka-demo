# Full local stack: one KRaft Kafka broker (no ZooKeeper) + the producer and consumer apps.
# `bash scripts/dev-local.sh up` builds the app images and starts everything, e2e.
services:
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.8.0}
    ports:
      - "9092:9092"          # host clients (your IDE, curl) connect here
    environment:
      # --- KRaft single-node (broker + controller in one process, no ZooKeeper) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093,INTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  producer:
    image: kafka-demo-producer:0.1.0
    build:
      context: .
      dockerfile: producer/Dockerfile
      args:
        REGISTRY: ${REGISTRY:-docker.io/library}
    ports:
      - "${PRODUCER_PORT:-8081}:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  consumer:
    image: kafka-demo-consumer:0.1.0
    build:
      context: .
      dockerfile: consumer/Dockerfile
      args:
        REGISTRY: ${REGISTRY:-docker.io/library}
    ports:
      - "${CONSUMER_PORT:-8082}:8082"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
